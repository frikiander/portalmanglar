<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="100%" height="100%">
  <defs>
    <filter id="full-manglar-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Group Emblem -->
  <g transform="translate(0, 0)">
    <!-- Green Square -->
    <rect
      x="44"
      y="18"
      width="96"
      height="96"
      fill="none"
      stroke="#63AB32"
      stroke-width="12"
      stroke-linejoin="miter"
      rx="3"
    />

    <!-- Yellow Circle -->
    <circle
      cx="70"
      cy="70"
      r="56"
      fill="none"
      stroke="#FACD00"
      stroke-width="12"
    />

    <!-- White Triangle -->
    <polygon
      points="144,12 85,128 190,128"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10.5"
      stroke-linejoin="miter"
      filter="url(#full-manglar-shadow)"
    />
  </g>

  <!-- Typography: Poppins / Geometric Sans-serif -->
  <g transform="translate(230, 0)">
    <!-- Top line: COLEGIO INTEGRAL -->
    <text
      x="0"
      y="62"
      fill="#232323"
      font-family="'Poppins', system-ui, sans-serif"
      font-size="28"
      font-weight="600"
      letter-spacing="0.1em"
    >
      COLEGIO INTEGRAL
    </text>

    <!-- Bottom line: EL MANGLAR -->
    <text
      x="0"
      y="122"
      fill="#232323"
      font-family="'Poppins', system-ui, sans-serif"
      font-size="54"
      font-weight="800"
      letter-spacing="-0.02em"
    >
      EL MANGLAR
    </text>
  </g>
</svg>
